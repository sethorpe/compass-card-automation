name: Compass Card Reload Report

on:
  schedule:
    - cron: '0 0 1 * *'   # Midnight UTC on the 1st of every month
  workflow_dispatch:        # Manual trigger from Actions tab

jobs:
  compass-automation:
    name: Download & Report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Build
        run: dotnet build --configuration Release

      - name: Install Playwright CLI
        run: dotnet tool install --global Microsoft.Playwright.CLI || true

      - name: Install Firefox
        run: playwright install --with-deps firefox

      # Decode the session file from GitHub Secrets
      # This avoids logging in entirely — no CAPTCHA risk in CI
      - name: Restore session file
        run: |
          mkdir -p auth
          echo "${{ secrets.COMPASS_SESSION }}" | base64 --decode > auth/session.json

      # Unit tests — no browser, no credentials needed
      - name: Run Unit Tests
        run: |
          dotnet test tests/CompassCard.Tests \
            --no-build --configuration Release \
            --filter "Category=Unit" \
            --logger "trx;LogFileName=unit-results.trx" \
            --results-directory ./test-results

      # E2E tests — uses session file, skips login
      - name: Run E2E Tests
        env:
          COMPASS_USERNAME: ${{ secrets.COMPASS_USERNAME }}
          COMPASS_PASSWORD: ${{ secrets.COMPASS_PASSWORD }}
          COMPASS_CARDNUMBER: ${{ secrets.COMPASS_CARDNUMBER }}
          Headless: true
        run: |
          dotnet test tests/CompassCard.Tests \
            --no-build --configuration Release \
            --filter "Category!=Unit" \
            --logger "trx;LogFileName=e2e-results.trx" \
            --results-directory ./test-results

      # Console app — the actual job
      - name: Run Console Automation
        env:
          COMPASS_USERNAME: ${{ secrets.COMPASS_USERNAME }}
          COMPASS_PASSWORD: ${{ secrets.COMPASS_PASSWORD }}
          COMPASS_CARDNUMBER: ${{ secrets.COMPASS_CARDNUMBER }}
          Headless: true
        run: |
          dotnet run \
            --project src/CompassCard.Console \
            --configuration Release \
            --no-build

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-report-${{ github.run_number }}
          path: |
            reports/report.txt
            reports/failure-*.png
          retention-days: 60

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: ./test-results/*.trx
          retention-days: 30