name: Compass Card Reload Report

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  compass-automation:
    name: Download & Report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Build
        run: dotnet build --configuration Release

      - name: Install Playwright CLI
        run: dotnet tool install --global Microsoft.Playwright.CLI || true

      - name: Install Firefox
        run: playwright install --with-deps firefox

      # Unit tests only in CI — E2E tests are local-only (see [Explicit] on test fixtures)
      - name: Run Unit Tests
        run: |
          dotnet test tests/CompassCard.Tests \
            --no-build --configuration Release \
            --filter "Category=Unit" \
            --logger "trx;LogFileName=unit-results.trx" \
            --results-directory ./test-results

      # Console app — attempts session load, falls back to direct login
      - name: Run Console Automation
        env:
          COMPASS_USERNAME: ${{ secrets.COMPASS_USERNAME }}
          COMPASS_PASSWORD: ${{ secrets.COMPASS_PASSWORD }}
          COMPASS_CARDNUMBER: ${{ secrets.COMPASS_CARDNUMBER }}
          Headless: true
        run: |
          dotnet run \
            --project src/CompassCard.Console \
            --configuration Release \
            --no-build

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compass-report-${{ github.run_number }}
          path: |
            reports/report.txt
            reports/failure-*.png
            logs/
          retention-days: 60

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: ./test-results/*.trx
          retention-days: 30